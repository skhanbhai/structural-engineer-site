  <circle cx="79" cy="236" r="12.5" fill="#E0631C"/><text x="79" y="240.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#FBFAF7">4</text>
  <text x="506" y="104" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="15" font-weight="500" fill="#17243F">Where cracks tend to appear</text>
  <circle cx="518" cy="130" r="12.5" fill="#E0631C"/><text x="518" y="134.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#FBFAF7">1</text>
  <text x="540" y="134" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" font-weight="500" fill="#17243F">Diagonal from an opening</text>
  <text x="540" y="150.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Window and door corners are where</text>
  <text x="540" y="164.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">a wall is weakest, so movement</text>
  <text x="540" y="179.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">concentrates there.</text>
  <circle cx="518" cy="203.5" r="12.5" fill="#E0631C"/><text x="518" y="208.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#FBFAF7">2</text>
  <text x="540" y="207.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" font-weight="500" fill="#17243F">Stepped through the mortar</text>
  <text x="540" y="223.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">In brickwork a crack follows the</text>
  <text x="540" y="238.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">joints, giving the staircase</text>
  <text x="540" y="252.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">pattern.</text>
  <circle cx="518" cy="277.0" r="12.5" fill="#E0631C"/><text x="518" y="281.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#FBFAF7">3</text>
  <text x="540" y="281.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" font-weight="500" fill="#17243F">At the extension junction</text>
  <text x="540" y="297.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Old and new foundations move</text>
  <text x="540" y="311.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">differently. Usually differential</text>
  <text x="540" y="326.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">settlement.</text>
  <circle cx="518" cy="350.5" r="12.5" fill="#E0631C"/><text x="518" y="355.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#FBFAF7">4</text>
  <text x="540" y="354.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" font-weight="500" fill="#17243F">Around a bay</text>
  <text x="540" y="370.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Bays often sit on shallower</text>
  <text x="540" y="385.0" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">footings than the main wall behind</text>
  <text x="540" y="399.5" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">them.</text>
</svg>