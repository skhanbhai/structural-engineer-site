<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 424" role="img" aria-labelledby="we-t we-d">
  <title id="we-t">Where cracks typically appear on a house elevation</title>
  <desc id="we-d">A house elevation with a later rear extension. Four locations are marked. One, cracks running diagonally from the corners of windows and doors, because openings are the weakest part of a wall. Two, cracks stepping through the mortar joints of brickwork in a staircase pattern. Three, a vertical crack at the junction between the original house and the extension, where older and newer foundations move differently. Four, cracking around a bay window, which often sits on shallower footings than the wall behind it.</desc>
