<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 284" role="img" aria-labelledby="ct-t ct-d">
  <title id="ct-t">How the taper of a crack indicates the type of ground movement</title>
  <desc id="ct-d">Three wall panels compared side by side. A subsidence crack is widest at the top and closes towards the bottom, because one part of the building has rotated downwards. A heave crack is the reverse, widest at the bottom and closing towards the top. A shrinkage or thermal movement crack stays roughly the same width along its entire length.</desc>
