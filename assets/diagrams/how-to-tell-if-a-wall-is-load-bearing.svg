  </g>
  <rect x="518" y="214" width="196" height="12" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
  <rect x="646" y="50" width="14" height="78" fill="#17243F"/>
  <rect x="646" y="140" width="14" height="74" fill="#17243F"/>
  <g stroke="#E0631C" stroke-width="1.4" fill="none" stroke-linecap="round"><line x1="676" y1="60" x2="676" y2="204" stroke-dasharray="2 3"/><polyline points="672,197 676,205 680,197"/></g>
  <text x="638" y="92" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#E0631C">upper wall</text>
  <text x="638" y="182" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#E0631C">sits on this one</text>
  <text x="518" y="268" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" fill="#4B5461">Load runs down. Structural.</text>
