    <rect x="123" y="178" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="28" y="194" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="123" y="194" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="28" y="210" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="123" y="210" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
  </g>
  <rect x="113" y="42" width="14" height="184" fill="#17243F"/>
  <text x="212" y="244" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#E0631C">joists end on the wall</text>
  <text x="22" y="268" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" fill="#4B5461">Floor rests on it. Likely.</text>
  <text x="270" y="24" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="16" font-weight="500" fill="#17243F">Joists run alongside</text>
  <rect x="270" y="42" width="196" height="184" fill="none" stroke="#D9DEE5" stroke-width="1.2"/>
  <g>
    <rect x="280" y="48" width="6" height="172" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
