  <rect x="361" y="42" width="14" height="184" fill="#17243F"/>
  <text x="460" y="244" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#E0631C">parallel, not onto it</text>
  <text x="270" y="268" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13.5" fill="#4B5461">Often a partition. Check above.</text>
  <text x="518" y="24" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="16" font-weight="500" fill="#17243F">A wall sits above it</text>
