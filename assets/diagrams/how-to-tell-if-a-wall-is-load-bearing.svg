    <rect x="123" y="114" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="28" y="130" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="123" y="130" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="28" y="146" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
    <rect x="123" y="146" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
