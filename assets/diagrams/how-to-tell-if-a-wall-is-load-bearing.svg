<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 284" role="img" aria-labelledby="lb-t lb-d">
  <title id="lb-t">Three clues that a wall is carrying load, drawn as plan and section views</title>
  <desc id="lb-d">Three panels compared side by side. The first is a plan looking down on a floor, with the joists running across to the wall and ending on it, so the wall is holding them up and is likely load-bearing. The second is the same plan with the joists running parallel to the wall, alongside it rather than onto it, which often means the wall is not carrying the floor. The third is a section through two storeys showing a wall on the upper floor sitting directly on top of the wall below, with the load from the upper wall passing down through the lower one to the ground, so the lower wall should be treated as load-bearing until shown otherwise.</desc>
  <rect width="736" height="284" fill="#FBFAF7"/>
  <text x="22" y="24" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="16" font-weight="500" fill="#17243F">Joists land on it</text>
  <rect x="22" y="42" width="196" height="184" fill="none" stroke="#D9DEE5" stroke-width="1.2"/>
  <g>
    <rect x="28" y="50" width="89" height="6" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1.2"/>
