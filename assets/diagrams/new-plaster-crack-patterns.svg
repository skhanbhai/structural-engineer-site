<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 284" role="img" aria-labelledby="pc-t pc-d">
  <title id="pc-t">Three patterns of cracking in new plaster and what each one means</title>
  <desc id="pc-d">Three wall panels compared side by side. The first shows crazing: a fine network of hairline cracks spread across the whole surface like crazy paving, caused by the plaster drying too fast, and cosmetic. The second shows a single straight hairline running vertically along the edge of a plasterboard sheet, caused by board movement or missing scrim tape, fixed by taping and filling. The third shows a diagonal crack rising from the top corner of a door opening and widening slightly as it goes, which means the wall behind the plaster has moved and the plaster is only reporting it.</desc>
