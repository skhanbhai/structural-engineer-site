<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" role="img" aria-labelledby="ic-t ic-d">
  <title id="ic-t">Which causes of cracking buildings insurance normally covers</title>
  <desc id="ic-d">Two columns. Normally covered: subsidence, where ground shrinks away beneath the footing; heave, where ground swells upwards; landslip; escape of water, where a leak washes out soil under a footing; and impact or storm damage. Normally excluded: shrinkage and thermal movement such as new plaster drying; settlement of a new build or extension bedding down; poor workmanship or design such as an undersized lintel or shallow foundations; and wear, tear and neglect such as blocked gutters or perished pointing. Policy wording varies by insurer.</desc>
  <rect width="800" height="464" fill="#FBFAF7"/>
  <text x="20" y="30" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="17" font-weight="500" fill="#17243F">The cause decides the claim, not the crack</text>
  <text x="20" y="50" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="13" fill="#4B5461">Your policy names the events it covers. The same crack is claimable or not depending which produced it.</text>
  <rect x="20" y="64" width="356" height="44" fill="#FBEFE4"/>
  <rect x="20" y="64" width="4" height="354" fill="#E0631C"/>
  <text x="42" y="92" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="15.5" font-weight="500" fill="#17243F">Normally covered</text>
  <rect x="20" y="108" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="46" cy="139" r="9" fill="#E0631C"/><path d="M 41.8,139.2 L 44.8,142.4 L 50.4,135.6" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="134" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Subsidence</text>
  <text x="66" y="153" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Ground shrinks away beneath the footing</text>
  <rect x="20" y="170" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="46" cy="201" r="9" fill="#E0631C"/><path d="M 41.8,201.2 L 44.8,204.4 L 50.4,197.6" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="196" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Heave</text>
  <text x="66" y="215" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Ground swells and pushes upwards</text>
  <rect x="20" y="232" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="46" cy="263" r="9" fill="#E0631C"/><path d="M 41.8,263.2 L 44.8,266.4 L 50.4,259.6" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="258" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Landslip</text>
  <text x="66" y="277" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Ground moves down a slope</text>
  <rect x="20" y="294" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="46" cy="325" r="9" fill="#E0631C"/><path d="M 41.8,325.2 L 44.8,328.4 L 50.4,321.6" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="320" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Escape of water</text>
  <text x="66" y="339" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">A leak washes out soil under a footing</text>
  <rect x="20" y="356" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="46" cy="387" r="9" fill="#E0631C"/><path d="M 41.8,387.2 L 44.8,390.4 L 50.4,383.6" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="382" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Impact or storm</text>
  <text x="66" y="401" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">A vehicle, a falling tree, storm damage</text>
