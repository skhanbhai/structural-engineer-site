  <text x="470" y="134" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Shrinkage and thermal</text>
  <text x="470" y="153" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">New plaster drying, render heating and cooling</text>
  <rect x="424" y="170" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="450" cy="201" r="9" fill="none" stroke="#6B7481" stroke-width="1.6"/><path d="M 446.4,197.4 L 453.6,204.6 M 453.6,197.4 L 446.4,204.6" stroke="#6B7481" stroke-width="1.8" stroke-linecap="round"/>
  <text x="470" y="196" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Settlement</text>
  <text x="470" y="215" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">A new build or extension bedding down</text>
  <rect x="424" y="232" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="450" cy="263" r="9" fill="none" stroke="#6B7481" stroke-width="1.6"/><path d="M 446.4,259.4 L 453.6,266.6 M 453.6,259.4 L 446.4,266.6" stroke="#6B7481" stroke-width="1.8" stroke-linecap="round"/>
  <text x="470" y="258" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Poor workmanship or design</text>
  <text x="470" y="277" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">An undersized lintel, shallow foundations</text>
  <rect x="424" y="294" width="356" height="62" fill="#F2F0EA" stroke="#D9DEE5" stroke-width="1"/>
  <circle cx="450" cy="325" r="9" fill="none" stroke="#6B7481" stroke-width="1.6"/><path d="M 446.4,321.4 L 453.6,328.6 M 453.6,321.4 L 446.4,328.6" stroke="#6B7481" stroke-width="1.8" stroke-linecap="round"/>
  <text x="470" y="320" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#17243F">Wear, tear and neglect</text>
  <text x="470" y="339" font-family="'Inter Tight','Inter',-apple-system,sans-serif" font-size="12" fill="#6B7481">Blocked gutters, perished pointing, a slow leak</text>
  <text x="424" y="386" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#6B7481">Check your own schedule &#8212; wording varies by insurer</text>
